name: ci

on:
  push:
  pull_request:

jobs:
  # Runs exactly what `pnpm verify` runs locally: script tests, lint, typecheck, Vitest (with the 100% coverage
  # thresholds on instruments and rules, Gate A, the facility-scope and seed checks) and the builds.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # Starts Postgres in Docker and checks that `pnpm dev` serves the API and all three apps.
  smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm smoke:dev
