# One Azure Container Registry run that builds and pushes the four images:
#
#   az acr run --registry <registry> --file infra/azure/acr-task.yaml \
#     --set TAG=<tag> --set NEXT_PUBLIC_API_URL=<the API's public address> <context>
#
# <context> is a folder or a .tar.gz of the repo (deploy.sh sends `git archive HEAD`, so exactly the committed files).
# `--set` supplies two values, TAG and NEXT_PUBLIC_API_URL, and both must be passed: a value left out renders as the text
# `<no value>`, which the Dockerfile refuses as an address and the registry refuses as a tag. NEXT_PUBLIC_PUBLIC_DEMO is not
# a value at all; it is written as `true` in each step, because this task builds the hosted public demo and nothing else.
#
# The four steps build the same Dockerfile, so they share its `build` stage and the agent's layer cache: the workspace is
# installed and built once, and the other three targets only copy from it. The Dockerfile refuses an empty
# NEXT_PUBLIC_API_URL; the person app is the only one that reads NEXT_PUBLIC_PUBLIC_DEMO. Every step builds for linux/amd64,
# which is what Container Apps runs, whatever machine the agent is.
version: v1.1.0
steps:
  - build: --platform linux/amd64 -t $Registry/mawsool-api:{{.Values.TAG}} --target api --build-arg NEXT_PUBLIC_API_URL={{.Values.NEXT_PUBLIC_API_URL}} --build-arg NEXT_PUBLIC_PUBLIC_DEMO=true -f Dockerfile .
  - build: --platform linux/amd64 -t $Registry/mawsool-person:{{.Values.TAG}} --target person --build-arg NEXT_PUBLIC_API_URL={{.Values.NEXT_PUBLIC_API_URL}} --build-arg NEXT_PUBLIC_PUBLIC_DEMO=true -f Dockerfile .
  - build: --platform linux/amd64 -t $Registry/mawsool-clinician:{{.Values.TAG}} --target clinician --build-arg NEXT_PUBLIC_API_URL={{.Values.NEXT_PUBLIC_API_URL}} --build-arg NEXT_PUBLIC_PUBLIC_DEMO=true -f Dockerfile .
  - build: --platform linux/amd64 -t $Registry/mawsool-ops:{{.Values.TAG}} --target ops --build-arg NEXT_PUBLIC_API_URL={{.Values.NEXT_PUBLIC_API_URL}} --build-arg NEXT_PUBLIC_PUBLIC_DEMO=true -f Dockerfile .
  - push:
      - $Registry/mawsool-api:{{.Values.TAG}}
      - $Registry/mawsool-person:{{.Values.TAG}}
      - $Registry/mawsool-clinician:{{.Values.TAG}}
      - $Registry/mawsool-ops:{{.Values.TAG}}
