<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Mawsool architecture</title>
  <desc>Three layers. Clients: the person's phone, the clinician app, the ops app and the mocked front doors, each talking only to the Ticket API; the phone sends what the person consents to, its crisis events (without answers) and its own registration. Behind the API: Postgres and the optional referral-summary assistant, which can call an outside LLM provider. Crisis numbers are dialled from the phone straight to the phone line, with no server involved.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-crisis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .band { fill: #f8fafc; stroke: #e2e8f0; }
      .band-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #64748b; }
      .line { font-size: 13px; fill: #334155; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; }
      .edge-label { font-size: 12px; fill: #334155; }
      .pill { fill: #ffffff; stroke: #cbd5e1; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; }
      .chip-text { font-size: 12.5px; fill: #1e293b; }
      .tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; }
    </style>
  </defs>

  <!-- Layers -->
  <rect class="band" x="16" y="16" width="1168" height="200" rx="10"/>
  <text class="band-label" x="36" y="40">CLIENTS</text>
  <rect class="band" x="16" y="286" width="1168" height="166" rx="10"/>
  <text class="band-label" x="36" y="310">SERVICE</text>
  <rect class="band" x="16" y="470" width="1168" height="154" rx="10"/>
  <text class="band-label" x="150" y="494">DATA AND OUTSIDE SERVICES</text>

  <!-- Clients -->
  <rect x="40" y="54" width="380" height="146" rx="8" fill="#ffffff"/>
  <path d="M48,54 H412 A8,8 0 0 1 420,62 V104 H40 V62 A8,8 0 0 1 48,54 Z" fill="#f0fdfa"/>
  <rect x="40" y="54" width="380" height="146" rx="8" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text class="title" x="58" y="77">Person's phone</text>
  <text class="sub" x="58" y="95">Installable web app, works offline</text>
  <text class="line" x="58" y="126">• Check-in, scoring, crisis trigger</text>
  <text class="line" x="58" y="146">• Matching (the rules run on the device)</text>
  <text class="line" x="58" y="166">• Encrypted local store</text>
  <text class="line" x="58" y="186">• Crisis numbers dialled directly</text>

  <rect x="440" y="54" width="220" height="146" rx="8" fill="#ffffff"/>
  <path d="M448,54 H652 A8,8 0 0 1 660,62 V104 H440 V62 A8,8 0 0 1 448,54 Z" fill="#eef2ff"/>
  <rect x="440" y="54" width="220" height="146" rx="8" fill="none" stroke="#4338ca" stroke-width="2"/>
  <text class="title" x="458" y="77">Clinician app</text>
  <text class="sub" x="458" y="95">Staff browser</text>
  <text class="line" x="458" y="126">• Queue</text>
  <text class="line" x="458" y="146">• Ticket detail</text>
  <text class="line" x="458" y="166">• FHIR export</text>

  <rect x="680" y="54" width="240" height="146" rx="8" fill="#ffffff"/>
  <path d="M688,54 H912 A8,8 0 0 1 920,62 V104 H680 V62 A8,8 0 0 1 688,54 Z" fill="#eef2ff"/>
  <rect x="680" y="54" width="240" height="146" rx="8" fill="none" stroke="#4338ca" stroke-width="2"/>
  <text class="title" x="698" y="77">Ops app</text>
  <text class="sub" x="698" y="95">Staff browser</text>
  <text class="line" x="698" y="126">• Dashboard</text>
  <text class="line" x="698" y="146">• Admin and demo clock</text>
  <text class="line" x="698" y="166">• Crisis-line console</text>

  <rect x="940" y="54" width="220" height="146" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="title" x="958" y="77">Front doors</text>
  <rect x="1094" y="63" width="50" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="tag" x="1103" y="77" style="fill:#475569">MOCK</text>
  <text class="sub" x="958" y="95">TAMM, health centre, school</text>
  <text class="line" x="958" y="126">• Hand over a positive</text>
  <text class="line" x="970" y="146">screen, which becomes an</text>
  <text class="line" x="970" y="166">invite the person claims</text>

  <!-- Service -->
  <rect x="320" y="318" width="840" height="118" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <text class="title" x="340" y="344">Ticket API</text>
  <text class="sub" x="430" y="344">Fastify + Zod · every ticket, consent and state change goes through it</text>
  <rect class="chip" x="340" y="358" width="140" height="28" rx="14"/>
  <text class="chip-text" x="410" y="377" text-anchor="middle">Tickets and events</text>
  <rect class="chip" x="490" y="358" width="124" height="28" rx="14"/>
  <text class="chip-text" x="552" y="377" text-anchor="middle">Consent ledger</text>
  <rect class="chip" x="624" y="358" width="186" height="28" rx="14"/>
  <text class="chip-text" x="717" y="377" text-anchor="middle">Encrypted shared bundles</text>
  <rect class="chip" x="820" y="358" width="70" height="28" rx="14"/>
  <text class="chip-text" x="855" y="377" text-anchor="middle">Audit</text>
  <rect class="chip" x="340" y="396" width="264" height="28" rx="14"/>
  <text class="chip-text" x="472" y="415" text-anchor="middle">Metrics with small-number suppression</text>
  <rect class="chip" x="614" y="396" width="120" height="28" rx="14"/>
  <text class="chip-text" x="674" y="415" text-anchor="middle">Signed inbound</text>
  <rect class="chip" x="744" y="396" width="96" height="28" rx="14"/>
  <text class="chip-text" x="792" y="415" text-anchor="middle">Sweep job</text>

  <!-- Data and outside services -->
  <rect x="40" y="510" width="240" height="98" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text class="title" x="58" y="536">Crisis phone lines</text>
  <text class="line" x="58" y="560">800-SAKINA, 999, 998</text>
  <text class="sub" x="58" y="582">Ordinary phone calls</text>

  <rect x="380" y="510" width="320" height="98" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text class="title" x="398" y="536">Postgres</text>
  <text class="sub" x="398" y="556">Drizzle, pg-boss</text>
  <text class="line" x="398" y="580">Tickets, events, consent, encrypted</text>
  <text class="line" x="398" y="598">bundles, audit rows, jobs</text>

  <rect x="760" y="510" width="400" height="98" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="title" x="778" y="536">Referral-summary assistant</text>
  <text class="sub" x="778" y="556">Optional, off by default</text>
  <text class="line" x="778" y="580">The only code that calls an LLM (Anthropic or</text>
  <text class="line" x="778" y="598">Microsoft Foundry), with the ticked items only</text>

  <!-- Edges, drawn last so they sit on top -->
  <line class="edge" x1="380" y1="200" x2="380" y2="316" marker-end="url(#arrow)"/>
  <rect class="pill" x="286" y="222" width="188" height="56" rx="6"/>
  <text class="edge-label" x="380" y="238" text-anchor="middle">what the person consents to,</text>
  <text class="edge-label" x="380" y="254" text-anchor="middle">crisis events (no answers),</text>
  <text class="edge-label" x="380" y="270" text-anchor="middle">the device's registration</text>

  <line class="edge" x1="550" y1="200" x2="550" y2="316" marker-end="url(#arrow)"/>
  <rect class="pill" x="496" y="238" width="108" height="24" rx="6"/>
  <text class="edge-label" x="550" y="254" text-anchor="middle">facility-scoped</text>

  <line class="edge" x1="800" y1="200" x2="800" y2="316" marker-end="url(#arrow)"/>
  <rect class="pill" x="712" y="230" width="176" height="40" rx="6"/>
  <text class="edge-label" x="800" y="246" text-anchor="middle">aggregates; consented</text>
  <text class="edge-label" x="800" y="262" text-anchor="middle">crisis-line notes</text>

  <line class="edge" x1="1050" y1="200" x2="1050" y2="316" marker-end="url(#arrow)"/>
  <rect class="pill" x="962" y="230" width="176" height="40" rx="6"/>
  <text class="edge-label" x="1050" y="246" text-anchor="middle">signed (HMAC) positive</text>
  <text class="edge-label" x="1050" y="262" text-anchor="middle">screens → invites</text>

  <line class="edge" x1="540" y1="436" x2="540" y2="508" marker-end="url(#arrow)"/>
  <line class="edge" x1="960" y1="436" x2="960" y2="508" marker-end="url(#arrow)"/>

  <line x1="130" y1="200" x2="130" y2="508" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-crisis)"/>
  <rect x="146" y="342" width="160" height="56" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text class="edge-label" x="158" y="362" style="fill:#991b1b">Dialled from the phone,</text>
  <text class="edge-label" x="158" y="378" style="fill:#991b1b">no server involved;</text>
  <text class="edge-label" x="158" y="394" style="fill:#991b1b">works offline</text>
</svg>
